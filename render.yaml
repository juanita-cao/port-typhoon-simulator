services:
  - type: web
    name: port-typhoon-simulator
    runtime: python
    region: singapore
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      npm --prefix frontend ci
      npm --prefix frontend run build
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --app-dir src
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
